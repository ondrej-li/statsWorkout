name: StatsWorkout

options:
  bundleIdPrefix: com.defik74
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: B592D69P29
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

targets:
  StatsWorkout:
    type: application
    platform: iOS
    sources:
      # The widget is its own target; its sources must not compile into the app.
      - path: Sources
        excludes:
          - Widgets/**
      - path: Resources
        buildPhase: resources
        excludes:
          # Only the extension's configuration screen reads these.
          - WidgetStrings/**
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.defik74.statsWorkout
        PRODUCT_NAME: StatsWorkout
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: StatsWorkout
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: "StatsWorkout reads your daily steps and workouts from Apple Health to build weekly, monthly, quarterly and yearly statistics. Your health data stays on this device and is never uploaded."
        NSHealthUpdateUsageDescription: "StatsWorkout only reads data from Apple Health. It does not save anything."
    entitlements:
      path: Supporting/StatsWorkout.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups:
          - group.com.defik74.statsWorkout
    dependencies:
      - target: StatsWorkoutWidgets
        embed: true

  StatsWorkoutWidgets:
    type: app-extension
    platform: iOS
    sources:
      # The widget shares the domain layer and the cache reader with the app, so
      # its numbers cannot drift from the dashboard's.
      - path: Sources/Widgets
      - path: Sources/Shared
      - path: Sources/Domain
      - path: Sources/Data/Cache
      - path: Sources/App/Localization
      - path: Resources/L10n
        buildPhase: resources
      # The configuration screen is drawn by the system, so its labels come from
      # .strings (generated by tools/generate-widget-strings.py).
      - path: Resources/WidgetStrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.defik74.statsWorkout.widgets
        PRODUCT_NAME: StatsWorkoutWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    info:
      path: Supporting/Widgets/Info.plist
      properties:
        CFBundleDisplayName: StatsWorkout
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Supporting/Widgets/StatsWorkoutWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.defik74.statsWorkout

  StatsWorkoutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: StatsWorkout
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.defik74.statsWorkout.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  StatsWorkout:
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - StatsWorkoutTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
    build:
      targets:
        StatsWorkout: all
        StatsWorkoutTests: [test]
        StatsWorkoutWidgets: all
