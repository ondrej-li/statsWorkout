name: StatsWorkout

options:
  bundleIdPrefix: com.defik74
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: B592D69P29
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

targets:
  StatsWorkout:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.defik74.statsWorkout
        PRODUCT_NAME: StatsWorkout
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: StatsWorkout
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: "StatsWorkout reads your daily steps and workouts from Apple Health to build weekly, monthly, quarterly and yearly statistics. Your health data stays on this device and is never uploaded."
        NSHealthUpdateUsageDescription: "StatsWorkout only reads data from Apple Health. It does not save anything."
    entitlements:
      path: Supporting/StatsWorkout.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []

  StatsWorkoutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: StatsWorkout
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.defik74.statsWorkout.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  StatsWorkout:
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - StatsWorkoutTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
    build:
      targets:
        StatsWorkout: all
        StatsWorkoutTests: [test]
